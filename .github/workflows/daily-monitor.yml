name: Daily QA Monitor
on:
  schedule:
    - cron: '0 7 * * *'
      timezone: America/Toronto
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-monitor.yml'
      - 'monitoring/**'
      - 'monitor-config.json'
      - 'requirements-actions.txt'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: daily-qa-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - name: Install monitor and Chromium
        run: |
          python -m pip install -r requirements-actions.txt
          python -m playwright install --with-deps chromium
      - name: Validate monitor against local storefront
        run: python -m unittest discover -s tests -v
      - name: Check all brands on desktop and mobile
        run: python -m monitoring.runner --config monitor-config.json --data-dir monitor-data
      - name: Publish readable run summary
        if: always()
        run: python -m monitoring.actions_summary
      - name: Save reports, database, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-data/
          retention-days: 30
          if-no-files-found: warn
